<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화학실험실 예약 — 종료</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#f4f9f5;color:#141a24;word-break:keep-all;
     min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:460px;width:100%;background:#fff;border:2px solid #bfe0c8;border-radius:18px;
      padding:38px 30px;text-align:center;box-shadow:0 10px 30px rgba(26,154,62,.12)}
img{height:52px;margin-bottom:18px}
.ey{font-size:13px;font-weight:800;letter-spacing:.12em;color:#1A9A3E;margin-bottom:8px}
h1{font-size:23px;font-weight:900;color:#0B3E86;margin-bottom:14px}
p{font-size:14.5px;color:#3d4652;line-height:1.7}
p b{color:#0B3E86}
.foot{margin-top:26px;font-size:12px;color:#98a3b3}
</style>
</head>
<body>
<div class="card">
  <img src="honam_logo.png" alt="호남고등학교" onerror="this.style.display='none'">
  <div class="ey">호남고등학교 과학과</div>
  <h1>화학실험실 예약이<br>종료되었습니다</h1>
  <p>
    실험실 사용 예약 기간이 마무리되어 접수를 닫았습니다.<br>
    <b>추가 사용 문의는 과학과(조영신)</b>로 연락해 주세요.
  </p>
  <div class="foot">제작 · 호남고 조영신</div>
</div>
</body>
</html>
