<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>히트 버짓 챌린지 — 교사 진행 화면</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --navy:#0B3E86; --navy2:#092f66; --gold:#F5B301; --gold-d:#c8920a;
  --green:#1A9A3E; --red:#d64545; --ink:#141a24; --soft:#3d4652; --line:#b9c4d4; --lt:#eef3fa;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{ height:100%; overflow:hidden; }
body{ font-family:'Noto Sans KR',sans-serif; color:var(--ink); background:#0d1524; word-break:keep-all; }

/* 잠금 */
#gate{ position:fixed; inset:0; background:#0d1524; z-index:99; display:flex; align-items:center; justify-content:center; }
#gate .box{ text-align:center; color:#fff; }
#gate input{ font:inherit; font-size:18px; padding:10px 16px; border-radius:10px; border:none; text-align:center; margin-top:14px; }

/* 슬라이드 */
.slide{ position:absolute; inset:0; display:none; flex-direction:column; background:#fff; padding:4.5vh 5vw; }
.slide.on{ display:flex; }
.kicker{ font-size:2vh; font-weight:700; color:var(--gold-d); letter-spacing:.14em; margin-bottom:1vh; }
h1.big{ font-size:7.5vh; font-weight:900; color:var(--navy2); letter-spacing:-.02em; line-height:1.2; }
h2.mid{ font-size:5vh; font-weight:900; color:var(--navy2); letter-spacing:-.02em; margin-bottom:2.5vh; }
.rule{ height:.7vh; width:18vh; background:linear-gradient(90deg,var(--gold),var(--green)); border-radius:4px; margin:2.5vh 0; }

/* 하단 진행바 */
#hud{ position:fixed; left:0; right:0; bottom:0; height:5.2vh; background:#0d1524; color:#8fa2c0;
  display:flex; align-items:center; gap:2vw; padding:0 1.6vw; font-size:1.9vh; z-index:50; }
#hud .sp{ flex:1; }
#hud b{ color:#fff; }
#hud .live{ color:#5fd08a; font-weight:700; }
#hud .dead{ color:#e07f7f; font-weight:700; }
.slide{ bottom:5.2vh; }

/* 액션 버튼 */
.acts{ position:fixed; right:1.6vw; bottom:7.5vh; display:flex; flex-direction:column; gap:1vh; z-index:60; }
.acts button{ font:inherit; font-size:2.1vh; font-weight:900; padding:1.4vh 2.4vh; border-radius:1.2vh;
  border:none; background:var(--navy); color:#fff; cursor:pointer; box-shadow:0 .4vh 1.2vh rgba(0,0,0,.25); }
.acts button.gold{ background:var(--gold); color:var(--navy2); }
.acts button.green{ background:var(--green); }
.acts button.ghost{ background:#e7ecf4; color:var(--soft); }
.acts button:disabled{ opacity:.4; cursor:default; }

/* 로비 */
.lobbywrap{ flex:1; display:flex; gap:4vw; align-items:center; }
.lobbyL{ flex:1.2; }
.lobbyL .url{ font-size:2.6vh; font-weight:700; color:var(--navy); background:var(--lt); border-radius:1vh; padding:1.4vh 2vh; display:inline-block; margin-top:2vh; }
.lobbyR{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2vh; }
#qr{ background:#fff; padding:1.5vh; border:.4vh solid var(--navy); border-radius:1.5vh; }
#qr img, #qr canvas{ width:30vh !important; height:30vh !important; }
.joined{ flex-shrink:0; margin-top:2vh; }
.joined .cnt{ font-size:3vh; font-weight:900; color:var(--navy); margin-bottom:1vh; }
.joined .cnt b{ font-size:5vh; color:var(--green); }
.teamsrow{ display:grid; grid-template-columns:repeat(5,1fr); gap:1vw; }
.teambox{ border:.25vh solid var(--line); border-radius:1vh; padding:1vh 1.2vh; min-height:11vh; }
.teambox h4{ font-size:1.9vh; color:var(--navy); border-bottom:.2vh solid var(--line); padding-bottom:.6vh; margin-bottom:.7vh; }
.teambox span{ display:inline-block; font-size:1.8vh; font-weight:700; background:var(--lt); border-radius:.6vh; padding:.2vh 1vh; margin:0 .4vh .5vh 0; }

/* 예측 */
.qbig{ font-size:4.6vh; font-weight:900; color:var(--ink); line-height:1.5; }
.qbig b{ color:var(--navy); }
#hist{ flex:1; display:flex; align-items:flex-end; gap:1vw; padding:3vh 2vw 0; }
.hbar{ flex:1; display:flex; flex-direction:column; align-items:center; gap:.8vh; }
.hbar .bar{ width:100%; background:var(--navy); border-radius:.8vh .8vh 0 0; min-height:.5vh; transition:height .4s; }
.hbar.hot .bar{ background:var(--gold); }
.hbar .lb{ font-size:1.8vh; font-weight:700; color:var(--soft); }
.hbar .n{ font-size:2.2vh; font-weight:900; color:var(--navy); }
.predmeta{ font-size:2.8vh; font-weight:700; color:var(--soft); margin-top:1.5vh; }
.predmeta b{ color:var(--gold-d); font-size:3.4vh; }

/* 목표/텍스트 슬라이드 */
.goals{ font-size:3.6vh; line-height:2; font-weight:500; }
.goals b{ color:var(--navy); font-weight:900; }
.goals .num{ display:inline-block; width:4.6vh; height:4.6vh; line-height:4.6vh; text-align:center;
  background:var(--navy); color:#fff; border-radius:50%; font-weight:900; margin-right:1.6vh; font-size:2.6vh; }

/* SVG 영역 */
.svgwrap{ flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
.svgwrap svg{ max-width:100%; max-height:100%; }

/* 퀴즈 */
.qhead2{ display:flex; align-items:center; gap:1.5vw; margin-bottom:1.5vh; }
.qhead2 .qn{ font-size:5vh; font-weight:900; color:var(--navy); }
.qhead2 .qr2{ font-size:2vh; font-weight:900; color:var(--gold-d); background:#fdf3d7; padding:.6vh 1.6vh; border-radius:3vh; }
.qhead2 .pts{ font-size:2vh; font-weight:700; color:var(--soft); }
.qtext{ font-size:4.2vh; font-weight:900; line-height:1.45; color:var(--ink); }
.qbody{ flex:1; display:flex; gap:3vw; margin-top:2.5vh; min-height:0; }
.choices{ flex:1; display:flex; flex-direction:column; gap:1.6vh; justify-content:center; }
.choice{ font-size:3.2vh; font-weight:700; padding:1.8vh 2.4vh; border-radius:1.4vh; border:.35vh solid var(--line); background:#fff; display:flex; align-items:center; gap:1.6vh; }
.choice .cn{ flex-shrink:0; width:5vh; height:5vh; border-radius:1vh; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:2.8vh; }
.c0 .cn{ background:#1f6fd6; } .c1 .cn{ background:var(--green); } .c2 .cn{ background:var(--gold-d); } .c3 .cn{ background:#7a4fc9; }
.choice.ans{ border-color:var(--green); background:#e9f7ee; }
.choice.dim{ opacity:.35; }
.oxrow{ flex:1; display:flex; gap:3vw; align-items:center; justify-content:center; }
.oxbig{ width:26vh; height:26vh; border-radius:3vh; color:#fff; display:flex; align-items:center; justify-content:center; font-size:16vh; font-weight:900; opacity:.9; }
.oxbig.o{ background:#1f6fd6; } .oxbig.x{ background:var(--red); }
.oxbig.dim{ opacity:.22; }
.oxbig.ans{ outline:1.2vh solid var(--gold); }
.qside{ flex:1; display:flex; flex-direction:column; min-height:0; }
.qstatus{ font-size:2.6vh; font-weight:700; color:var(--soft); margin-top:auto; padding-top:1.5vh; }
.qstatus b{ font-size:4vh; color:var(--navy); }
.expl{ display:none; background:var(--lt); border-left:.7vh solid var(--gold); border-radius:.8vh;
  padding:1.6vh 2vh; font-size:2.5vh; line-height:1.6; margin-top:1.5vh; }
.expl.on{ display:block; }
.expl b{ color:var(--navy); }

/* 리더보드 */
.lb2{ flex:1; display:flex; gap:4vw; min-height:0; }
.lbcol{ flex:1; display:flex; flex-direction:column; gap:1.2vh; }
.lbcol h3{ font-size:2.6vh; color:var(--navy); border-bottom:.3vh solid var(--navy); padding-bottom:.8vh; margin-bottom:.5vh; }
.lbrow{ display:flex; align-items:center; gap:1.2vw; font-size:2.8vh; font-weight:700; }
.lbrow .rk{ width:4.5vh; height:4.5vh; border-radius:50%; background:var(--lt); color:var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:900; font-size:2.2vh; flex-shrink:0; }
.lbrow:nth-child(2) .rk{ background:var(--gold); color:#fff; }
.lbrow .nm{ width:16vh; }
.lbrow .barw{ flex:1; background:#eef1f6; border-radius:.8vh; height:3.6vh; }
.lbrow .bar2{ height:100%; background:var(--navy); border-radius:.8vh; min-width:1vh; transition:width .5s; }
.lbrow .sc{ width:11vh; text-align:right; color:var(--navy); font-weight:900; }
.lbrow.team .bar2{ background:var(--green); }

/* 문장/투표 */
.sents{ flex:1; display:flex; flex-direction:column; gap:1.6vh; justify-content:center; }
.sent{ display:flex; align-items:center; gap:1.6vw; border:.3vh solid var(--line); border-radius:1.4vh; padding:1.8vh 2.2vh; }
.sent .tno{ flex-shrink:0; font-size:2.4vh; font-weight:900; color:#fff; background:var(--navy); border-radius:1vh; padding:.8vh 1.6vh; }
.sent .tx{ flex:1; font-size:3vh; font-weight:700; line-height:1.5; }
.sent .vt{ flex-shrink:0; font-size:2.6vh; font-weight:900; color:var(--gold-d); }
.sent.best{ border-color:var(--gold); background:#fffaf0; }
.sent.empty .tx{ color:#a8b2c0; font-weight:500; }

/* 정리 */
.sumflow{ flex:1; display:flex; align-items:center; justify-content:center; gap:2vw; }
.sumbox{ text-align:center; border:.4vh solid var(--navy); border-radius:1.6vh; padding:3vh 2.5vh; font-size:3vh; font-weight:900; color:var(--navy2); line-height:1.5; }
.sumbox small{ display:block; font-size:2vh; font-weight:700; color:var(--soft); margin-top:.8vh; }
.sumarrow{ font-size:5vh; font-weight:900; color:var(--gold-d); }

/* 모둠 보드 (열수지 퍼즐) */
.pzgrid{ flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:1.5vh 1vw; min-height:0; margin-top:1vh; }
.pzcard{ border:.3vh solid var(--line); border-radius:1.2vh; padding:1vh 1.2vh; cursor:pointer;
  display:flex; flex-direction:column; min-height:0; overflow:hidden; background:#fff; }
.pzcard:hover{ border-color:var(--navy); }
.pzcard h4{ display:flex; align-items:center; gap:.6vw; font-size:2vh; color:var(--navy); margin-bottom:.6vh; }
.pzcard h4 .sp{ flex:1; }
.pzcard .meta{ font-size:1.5vh; color:var(--soft); font-weight:700; }
.pzcard.note{ cursor:default; background:var(--lt); border-style:dashed; font-size:2vh; line-height:1.8;
  color:var(--soft); font-weight:500; justify-content:center; padding:1.5vh 2vh; }
.pzfit{ position:relative; width:100%; height:0; padding-bottom:54.17%; overflow:hidden; border-radius:.8vh; }
.pzsvgbox{ position:absolute; inset:0; }
.pzsvgbox svg{ width:100%; height:100%; display:block; }
.pzfit canvas{ position:absolute; inset:0; width:100%; height:100%; }
.pzans{ background:var(--lt); border-left:.6vh solid var(--gold); border-radius:.8vh;
  padding:1.4vh 1.8vh; font-size:2.7vh; line-height:1.55; font-weight:700; }
.pzans b{ display:block; font-size:1.8vh; color:var(--navy); margin-bottom:.4vh; }
.dim2{ color:#a8b2c0; font-weight:500; }

/* 퇴장권 피드 */
.exits{ flex:1; overflow:hidden; display:flex; flex-direction:column; gap:1vh; margin-top:1vh; }
.exline{ font-size:2.6vh; font-weight:500; }
.exline b{ color:var(--navy); font-weight:900; margin-right:1vh; }
</style>
</head>
<body>

<div id="gate"><div class="box">
  <div style="font-size:22px;font-weight:900">히트 버짓 챌린지 · 교사 화면</div>
  <input type="password" id="gatePw" placeholder="비밀번호"><br>
  <div style="font-size:12px;opacity:.6;margin-top:10px">Enter로 입장</div>
</div></div>

<div id="stage"></div>

<div class="acts" id="acts"></div>

<div id="hud">
  <span id="hudConn" class="dead">연결 중…</span>
  <span>접속 <b id="hudN">0</b>명</span>
  <span class="sp"></span>
  <span>←/→ 슬라이드 · Space 진행</span>
  <span><b id="hudPg">1</b> / <span id="hudTot">?</span></span>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBotwjsJxit4SbOzXVVOov37Po97AieoxM",
  authDomain: "sangdam-b97c1.firebaseapp.com",
  projectId: "sangdam-b97c1",
  storageBucket: "sangdam-b97c1.firebasestorage.app",
  messagingSenderId: "389048360844",
  appId: "1:389048360844:web:675f4f6ce8d54a873140a9"
};
const COL = "pw_openclass_heat";
const STUDENT_URL = "https://zeroyoung-collab.github.io/hn-sci/openclass/";
const db = getFirestore(initializeApp(firebaseConfig));

/* ── 게이트 ── */
document.getElementById("gatePw").addEventListener("keydown", e => {
  if(e.key === "Enter" && e.target.value === "honam1234"){ document.getElementById("gate").remove(); }
});
if(new URLSearchParams(location.search).get("pw") === "honam1234"){ document.getElementById("gate").remove(); }

/* ── 문항(정답·해설 포함 — 이 파일에만 존재) ── */
const QUIZ = [
  {type:"ox", base:100, text:"지구는 태양에서 받는 에너지만큼 우주로 내보내고 있어서, 평균 기온이 거의 일정하게 유지된다.", ans:0,
   expl:"<b>정답 O — 복사 평형.</b> 흡수량 = 방출량이라 온도가 (거의) 일정하다. 이 균형이 오늘 수업의 핵심!"},
  {type:"ox", base:100, text:"온실효과는 인간 활동이 만들어 낸 현상이다.", ans:1,
   expl:"<b>정답 X.</b> 온실효과 자체는 수십억 년 된 <b>자연 현상</b>. 문제는 인간 활동이 이를 <b>'강화'</b>한 것이다."},
  {type:"ox", base:100, text:"태양 복사 에너지 100 중 약 30은 흡수되지 못하고 그대로 우주로 반사된다.", ans:0,
   expl:"<b>정답 O.</b> 구름·대기·지표에서 약 30이 반사된다(반사율 = 알베도). 도입에서 예측한 바로 그 값!"},
  {type:"ox", base:100, text:"온실효과가 아예 없다면 지구 평균 기온은 지금보다 높아질 것이다.", ans:1,
   expl:"<b>정답 X.</b> 온실효과가 없으면 평균 기온은 약 <b>−18℃</b>. 온실효과 덕분에 현재 약 15℃가 유지된다."},
  {type:"mc", base:100, text:"태양 복사 에너지 100 중 지표가 흡수하는 양은?", ch:["20","30","50","70"], ans:2,
   expl:"<b>정답 ③ 50.</b> 반사 30 + 대기·구름 흡수 20 + <b>지표 흡수 50</b> = 100. 흡수 합계는 70. (미래엔 교과서 84쪽)"},
  {type:"mc", base:100, text:"다음 중 온실 기체가 <u>아닌</u> 것은?", ch:["이산화 탄소","메테인","수증기","질소"], ans:3,
   expl:"<b>정답 ④ 질소.</b> 대기의 78%를 차지하지만 지구 복사(적외선)를 거의 흡수하지 못한다. 수증기도 강력한 온실 기체라는 점 주의!"},
  {type:"mc", base:100, text:"지구가 우주로 내보내는 '지구 복사 에너지'는 주로 어떤 형태일까?", ch:["가시광선","적외선","자외선","X선"], ans:1,
   expl:"<b>정답 ② 적외선.</b> 온도가 낮은 지구는 파장이 긴 적외선으로 방출한다. (태양 복사 = 주로 가시광선)"},
  {type:"mc", base:100, text:"온실 기체가 하는 일로 옳은 것은?", ch:["태양 복사를 모두 반사한다","지구 복사를 흡수했다가 일부를 지표로 재복사한다","지표의 반사율을 높인다","태양 복사가 지표에 도달하지 못하게 막는다"], ans:1,
   expl:"<b>정답 ②.</b> 온실 기체는 나가는 <b>적외선을 붙잡아 재복사</b>한다. 담요처럼 '나가는 열'을 잡는 것이지, 들어오는 빛을 막는 게 아니다."},
  {type:"mc", base:200, text:"[자료] 하와이 마우나로아에서 관측한 대기 중 CO₂ 농도이다. 농도가 계속 증가하는 주된 원인은?", ch:["화산 활동 증가","화석 연료 사용","태양 활동 강화","지구 자전 속도 변화"], ans:1, svg:"keeling",
   expl:"<b>정답 ② 화석 연료 사용.</b> 산업화 이후 가파른 증가. 톱니 모양은 계절에 따른 <b>식물 광합성</b>(여름에 CO₂ 흡수) 때문!"},
  {type:"mc", base:200, text:"[자료] 대기 중 온실 기체가 증가한 직후, 새로운 평형에 도달하기 전까지 지구에서 일어나는 일은?", ch:["흡수량 > 방출량이 되어 기온이 오른다","방출량 > 흡수량이 되어 기온이 내린다","반사율이 커져 기온이 내린다","아무 변화가 없다"], ans:0, svg:"compare",
   expl:"<b>정답 ①.</b> 재복사가 늘어 우주로 나가는 양이 잠시 줄면 <b>흡수 > 방출</b> → 기온 상승 → 더 높은 온도에서 새 평형. 이것이 지구 온난화의 메커니즘이다."},
];
const BONUS = 100, BONUS_MS = 20000;

/* ── SVG 자료 ── */
function svgKeeling(){
  let pts = "", x0=90, y0=330, w=640, h=250;
  for(let i=0;i<=65;i++){
    const t = i/65;
    const ppm = 315 + t*t*38 + t*75;                    // 완만→가속 증가
    const season = 3.2*Math.sin(i*3.1);                  // 톱니(계절 변동)
    const x = x0 + t*w, y = y0 - ((ppm+season-310)/120)*h;
    pts += `${x.toFixed(1)},${y.toFixed(1)} `;
  }
  return `<svg viewBox="0 0 800 400">
    <line x1="80" y1="340" x2="750" y2="340" stroke="#3d4652" stroke-width="2.5"/>
    <line x1="80" y1="340" x2="80" y2="40" stroke="#3d4652" stroke-width="2.5"/>
    <text x="70" y="345" text-anchor="end" font-size="17" fill="#3d4652">310</text>
    <text x="70" y="240" text-anchor="end" font-size="17" fill="#3d4652">350</text>
    <text x="70" y="135" text-anchor="end" font-size="17" fill="#3d4652">390</text>
    <text x="70" y="50" text-anchor="end" font-size="17" fill="#3d4652">430</text>
    <text x="30" y="200" font-size="18" fill="#0B3E86" font-weight="900" transform="rotate(-90 30 200)">CO₂ 농도 (ppm)</text>

function fatArrow(x1,y1,x2,y2,w,fill,stroke){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy), ux=dx/L, uy=dy/L, px=-uy, py=ux;
  const hl=Math.min(w*1.7, L*.4), hw=w*2.1, bx=x2-ux*hl, by=y2-uy*hl, h=w/2;
  const P=(x,y)=>`${x.toFixed(1)},${y.toFixed(1)}`;
  return `<polygon points="${P(x1+px*h,y1+py*h)} ${P(bx+px*h,by+py*h)} ${P(bx+px*hw/2,by+py*hw/2)} ${P(x2,y2)} ${P(bx-px*hw/2,by-py*hw/2)} ${P(bx-px*h,by-py*h)} ${P(x1-px*h,y1-py*h)}" fill="${fill}" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" opacity=".95"/>`;
}

}

function pzStrokesDraw(cv, strokes){
  const wrap = cv.parentElement, w = wrap.clientWidth; if(!w) return;
  const W = Math.round(w*2), H = Math.round(W*520/960);
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  (strokes||[]).forEach(s => {
    const p = s.p || []; if(p.length < 4) return;
    c.strokeStyle = s.c; c.fillStyle = s.c; c.lineWidth = (s.w||10)*W/960;
    c.lineCap = "round"; c.lineJoin = "round"; c.beginPath();
    for(let i=0;i<p.length;i+=2){ const x=p[i]*W, y=p[i+1]*H; i ? c.lineTo(x,y) : c.moveTo(x,y); }
    c.stroke();
    const n=p.length, x2=p[n-2]*W, y2=p[n-1]*H;
    let ix=n-4; while(ix>1 && Math.hypot(p[ix]*W-x2, p[ix+1]*H-y2) < 14*W/960) ix-=2;
    const a=Math.atan2(y2-p[ix+1]*H, x2-p[ix]*W), hl=26*W/960;
    c.beginPath(); c.moveTo(x2,y2);
    c.lineTo(x2-hl*Math.cos(a-.5), y2-hl*Math.sin(a-.5));
    c.lineTo(x2-hl*Math.cos(a+.5), y2-hl*Math.sin(a+.5));
    c.closePath(); c.fill();
  });
}

}

  (s.acts ? s.acts() : []).forEach(([label, cls, fn, disabled]) => {
    const b = document.createElement("button");
    b.textContent = label; b.className = cls; b.disabled = !!disabled; b.onclick = fn;
    actsEl.appendChild(b);
  });
  if(s.after) s.after();
}
function go(n){
  if(n < 0 || n >= slides.length) return;
  cur = n;
  const s = slides[cur];
  if(s.enter) s.enter();
  render();
}
document.addEventListener("keydown", e => {
  if(document.getElementById("gate")) return;
  if(e.key === "ArrowRight" || e.key === "PageDown") go(cur+1);
  else if(e.key === "ArrowLeft" || e.key === "PageUp") go(cur-1);
  else if(e.key === " "){ e.preventDefault();
    const s = slides[cur];
    if(!(s.space && s.space())) go(cur+1);
  }
  else if(e.key === "f" || e.key === "F"){ document.documentElement.requestFullscreen?.(); }
});
go(Math.min(slides.length-1, Math.max(0, +(new URLSearchParams(location.search).get("slide") || 0))));
</script>
